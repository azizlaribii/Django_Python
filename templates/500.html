<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur - SantéConnect</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
        main { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 40px; max-width: 560px; margin: 16px; text-align: center; }
        .code { font-size: 3rem; font-weight: 800; color: #b91c1c; margin: 0; }
        h1 { font-size: 1.5rem; margin: 8px 0 12px; }
        p { color: #475569; line-height: 1.6; }
        a { display: inline-block; margin-top: 16px; padding: 10px 20px; border-radius: 10px; background: #0369a1; color: #fff; text-decoration: none; font-weight: 600; }
        a:focus-visible { outline: 3px solid #0f172a; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <p class="code" aria-hidden="true">500</p>
        <h1>Une erreur est survenue</h1>
        <p>Le serveur n'a pas pu traiter votre demande. L'équipe technique a été informée. Réessayez dans quelques instants.</p>
        <a href="/">Retour à l'accueil</a>
    </main>
</body>
</html>
