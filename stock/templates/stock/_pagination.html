{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="Pagination" style="display:flex; justify-content:center; align-items:center; gap:12px; margin-top:20px;">
    {% if page_obj.has_previous %}<a class="btn btn-secondary btn-sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" rel="prev"><span aria-hidden="true">←</span> Page précédente</a>{% endif %}
    <span class="muted" aria-current="page">Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="btn btn-secondary btn-sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}" rel="next">Page suivante <span aria-hidden="true">→</span></a>{% endif %}
</nav>
{% endif %}
