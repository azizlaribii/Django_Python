<div class="a11y-bar" role="group" aria-label="Confort de lecture">
    <span class="a11y-bar-label" aria-hidden="true">Aa</span>
    <div class="a11y-seg" role="group" aria-label="Taille du texte">
        <button type="button" class="a11y-btn" data-a11y="taille-moins" aria-label="Réduire la taille du texte"><span aria-hidden="true">A−</span></button>
        <button type="button" class="a11y-btn" data-a11y="taille-normal" aria-label="Taille du texte normale" aria-pressed="true"><span aria-hidden="true">A</span></button>
        <button type="button" class="a11y-btn" data-a11y="taille-plus" aria-label="Agrandir la taille du texte"><span aria-hidden="true">A+</span></button>
    </div>
    <span class="a11y-sep" aria-hidden="true"></span>
    <button type="button" class="a11y-btn" data-a11y="contraste" aria-pressed="false"><span aria-hidden="true">◐</span> Contraste élevé</button>
    <span id="a11y-annonce" class="sr-only" role="status" aria-live="polite"></span>
</div>
